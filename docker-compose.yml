services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fuel_rewards
    ports:
      - '5432:5432'
    volumes:
      - fuel_rewards_pgdata:/var/lib/postgresql/data

volumes:
  fuel_rewards_pgdata:
